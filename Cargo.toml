[package]
name = "manga-source"
version = "0.1.0"
edition = "2021"

[lib]
name = "manga_source"
path = "src/lib.rs"

[[bin]]
name = "manga-source"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
zip = "2.1"
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
regex = "1.10"
axum = "0.7"
open = "5.1"
printpdf = "0.7"
image = "0.25"
tokio-tungstenite = "0.30.0"
